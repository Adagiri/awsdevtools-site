<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>awsdevtools - Launching Soon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #121212;
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        padding: 20px;
      }
      .content {
        max-width: 600px;
        width: 100%;
      }
      h1 {
        font-size: 3rem;
        color: #ff9900;
        margin-bottom: 20px;
      }
      h2 {
        font-size: 2rem;
        margin-bottom: 15px;
        color: #ffffff;
      }
      p {
        font-size: 1.1rem;
        color: #bbbbbb;
        margin-bottom: 30px;
        line-height: 1.5;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 30px;
      }
      input[type='text'],
      input[type='email'] {
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        background-color: #1e1e1e;
        color: #ffffff;
      }
      input::placeholder {
        color: #888;
      }
      .btn {
        display: inline-block;
        padding: 12px 30px;
        background-color: #ff9900;
        color: #121212;
        font-size: 1rem;
        border-radius: 4px;
        transition: background 0.3s;
        border: none;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn:hover:enabled {
        background-color: #e88b00;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>awsdevtools</h1>
      <h2>Launching Soon</h2>
      <p>
        Make your AWS workflow simpler with our easy tools and expert guidance.
        Automate onboarding, cost management, security checks, and more — all
        with a single click.
      </p>

      <form id="subscribe-form">
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Your Name"
          required
        />
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Your Email"
          required
        />
        <input
          type="hidden"
          name="purpose"
          id="purpose"
          value="awsdevtools wait list"
        />
        <button type="submit" id="submit-btn" class="btn">Notify Me</button>
      </form>
    </div>

    <script>
      document
        .getElementById('subscribe-form')
        .addEventListener('submit', async function (event) {
          event.preventDefault();
          const btn = document.getElementById('submit-btn');
          const originalText = btn.textContent;
          btn.textContent = 'Loading...';
          btn.disabled = true;

          const data = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            purpose: document.getElementById('purpose').value,
          };

          try {
            const response = await fetch(
              'https://ghbxpi1w3e.execute-api.us-east-1.amazonaws.com/production/subscribe',
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
              }
            );

            if (response.ok) {
              alert('Subscription successful!');
              document.getElementById('subscribe-form').reset();
            } else {
              const error = await response.text();
              alert('Subscription failed: ' + error);
            }
          } catch (err) {
            alert('Submission error. Please try again later.');
          } finally {
            btn.textContent = originalText;
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
